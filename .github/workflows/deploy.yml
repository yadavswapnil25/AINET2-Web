name: React App Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies and build
      - name: Install dependencies
        run: npm ci

      - name: Build React app
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_RAZORPAY_KEY: ${{ secrets.VITE_RAZORPAY_KEY }}
        run: npm run build

      # 4. Zip the build output
      - name: Archive production build
        run: zip -r react-build.zip dist  # 'build' for CRA, 'dist' for Vite

      # 5. Upload build zip to server
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "react-build.zip"
          target: "/root/react/"

      # 6. SSH into server to deploy
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The new build is copied over the old one instead of replacing it.
          # Old files in assets/ stay for 7 days, so a page someone opened
          # before the deploy can still load the files it asks for. New
          # assets go in first and index.html last, so a visitor never gets
          # a new index.html that points at files not copied yet.
          script: |
            unzip -o /root/react/react-build.zip -d /root/react/
            mkdir -p /var/www/ainet2-web-build/assets
            cp -a /root/react/dist/assets/. /var/www/ainet2-web-build/assets/
            find /root/react/dist -maxdepth 1 -type f ! -name index.html -exec cp -a {} /var/www/ainet2-web-build/ \;
            find /root/react/dist -mindepth 1 -maxdepth 1 -type d ! -name assets -exec cp -a {} /var/www/ainet2-web-build/ \;
            cp -a /root/react/dist/index.html /var/www/ainet2-web-build/index.html
            find /var/www/ainet2-web-build/assets -type f -mtime +7 -delete
            rm -rf /root/react/
            find /var/www/ainet2-web-build -type d -exec chmod 755 {} \;
            find /var/www/ainet2-web-build -type f -exec chmod 644 {} \;
            sudo systemctl reload nginx
